# A catalog of locally served models. Point ALETHIC_MODEL_CATALOG_PATH at this file
# to run the whole platform without a provider key and without spending anything:
#
#   ALETHIC_MODEL_CATALOG_PATH=infrastructure/llm/models.local.toml uv run alethic ask "..."
#
# It expects a local server on http://127.0.0.1:11434/v1 (Ollama's default) with
# these models pulled. Costs are zero because they are: the price of a local call
# is electricity, not billing.

# Ollama serves some models by running them on its own machines rather than on
# this one. They are reached through the same local endpoint and need no
# provider key here, so they belong in this catalog - but the entry says so,
# because "local" in the file name stops being literally true for this one.
# Available only if `ollama pull gemma4:31b-cloud` has been run and the account
# behind it can reach the cloud tier.
[models.local-strong]
provider = "local"
model = "gemma4:31b-cloud"
capabilities = ["TEXT_REASONING", "TOOL_CALLING", "STRUCTURED_OUTPUT", "LONG_CONTEXT", "CODE"]
context_tokens = 131072
input_cost_per_1k_usd = 0.0
output_cost_per_1k_usd = 0.0
quality = 0.8

[models.local-balanced]
provider = "local"
model = "gpt-oss:20b"
capabilities = ["TEXT_REASONING", "TOOL_CALLING", "STRUCTURED_OUTPUT", "LONG_CONTEXT", "CODE"]
context_tokens = 131072
input_cost_per_1k_usd = 0.0
output_cost_per_1k_usd = 0.0
quality = 0.6

[models.local-fast]
provider = "local"
model = "lfm2.5:8b"
capabilities = ["TEXT_REASONING", "TOOL_CALLING", "STRUCTURED_OUTPUT", "LONG_CONTEXT"]
context_tokens = 32768
input_cost_per_1k_usd = 0.0
output_cost_per_1k_usd = 0.0
quality = 0.4

# Reading a screen is the one thing in the platform that needs eyes. The router
# is asked for VISION and answers from here; without an entry that offers it,
# every computer-use run fails at routing with a message about this file, which
# is the right place for that to be fixed.
[models.local-vision]
provider = "local"
model = "qwen2.5vl:7b"
capabilities = ["TEXT_REASONING", "VISION", "STRUCTURED_OUTPUT"]
context_tokens = 32768
input_cost_per_1k_usd = 0.0
output_cost_per_1k_usd = 0.0
quality = 0.6

# The stronger entry takes the work that decides things - planning, acting,
# writing the answer - and the small ones keep the cheap, structured jobs.
# Anything here still runs without a provider key.
[defaults]
planning = "local-strong"
execution = "local-strong"
verification = "local-fast"
synthesis = "local-strong"
extraction = "local-fast"
conversation = "local-strong"
